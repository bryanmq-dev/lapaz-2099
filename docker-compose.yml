services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: lapaz
      POSTGRES_PASSWORD: lapaz
      POSTGRES_DB: lapaz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapaz -d lapaz"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://lapaz:lapaz@db:5432/lapaz
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    depends_on:
      - api

volumes:
  pgdata:
